<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大阪シティバス 運行情報</title>
    <style>
        :root {
            --primary-color: #0066cc;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
            --badge-bg: #e6f0fa;
            --badge-text: #0055b3;
            --border-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .update-time {
            font-size: 0.8rem;
            margin-top: 6px;
            opacity: 0.9;
        }

        .route-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .route-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .bus-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bus-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background-color: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .bus-times {
            display: flex;
            flex-direction: column;
        }

        .dep-time {
            font-size: 1.3rem;
            font-weight: bold;
            color: #222;
        }

        .arr-time {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .bus-status-group {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .status-badge {
            background-color: var(--badge-bg);
            color: var(--badge-text);
            font-size: 0.8rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .plan-code {
            font-size: 0.75rem;
            color: #999;
        }

        .empty-message {
            text-align: center;
            color: var(--text-sub);
            padding: 20px 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>🚌 大阪シティバス バスナニ</h1>
        <div class="update-time" id="updated-at">最終更新: 読み込み中...</div>
    </header>

    <main id="app">
        <!-- ここにバス情報が描画されます -->
    </main>

    <!-- キャッシュを回避して data.js を動的に読み込む -->
    <script>
        const script = document.createElement('script');
        script.src = 'data.js?v=' + new Date().getTime();
        document.head.appendChild(script);
    </script>

    <!-- 画面描画スクリプト -->
    <script>
        function renderBusInfo(busData) {
            document.getElementById("updated-at").textContent = `最終更新: ${busData.updated_at}`;

            const appDiv = document.getElementById("app");
            appDiv.innerHTML = "";

            busData.routes.forEach(route => {
                const card = document.createElement("section");
                card.className = "route-card";

                const title = document.createElement("h2");
                title.className = "route-title";
                title.textContent = route.route_name;
                card.appendChild(title);

                if (route.buses.length === 0) {
                    const empty = document.createElement("div");
                    empty.className = "empty-message";
                    empty.textContent = "現在、表示できる運行情報はありません。";
                    card.appendChild(empty);
                } else {
                    const list = document.createElement("div");
                    list.className = "bus-list";

                    route.buses.forEach(bus => {
                        const item = document.createElement("div");
                        item.className = "bus-item";

                        item.innerHTML = `
                            <div class="bus-times">
                                <span class="dep-time">${bus.dep_time} 発</span>
                                <span class="arr-time">到着予定: ${bus.arr_time}</span>
                            </div>
                            <div class="bus-status-group">
                                <span class="status-badge">${bus.status}</span>
                                <span class="plan-code">便ID: ${bus.plan_cd}</span>
                            </div>
                        `;
                        list.appendChild(item);
                    });

                    card.appendChild(list);
                }

                appDiv.appendChild(card);
            });
        }

        // data.js の読み込みが完了したら描画を実行
        window.addEventListener('load', () => {
            if (typeof data !== 'undefined') {
                renderBusInfo(data);
            }
        });
    </script>
</body>
</html>
