<script>
    // routes 配列の中に表示したい系統を追加していきます
    const data = {
        "updated_at": "2026-06-06 (テスト表示)",
        "routes": [
            {
                "route_name": "34号系統（大阪駅前 ➔ 守口車庫前）",
                "buses": [
                    { "bien_index": 1, "plan_cd": "test1", "bv_id": "1234", "shaban": "お試し1号" },
                    { "bien_index": 2, "plan_cd": "test2", "bv_id": "5678", "shaban": "お試し2号" }
                ]
            },
            {
                "route_name": "36号系統（大阪駅前 ➔ 地下鉄門真南）",  /* ← 2系統目を追加 */
                "buses": [
                    { "bien_index": 1, "plan_cd": "test3", "bv_id": "9012", "shaban": "お試し3号" },
                    { "bien_index": 2, "plan_cd": "test4", "bv_id": "",     "shaban": "未登録" }
                ]
            }
            // 今後増やしたい路線はここにカンマ区切りで追加
        ]
    };

    // 画面に反映する処理（この部分は変更なしで全路線自動ループ描画されます）
    function renderBusData() {
        document.getElementById('updateTime').textContent = `最終更新: ${data.updated_at}`;
        const contentArea = document.getElementById('contentArea');
        contentArea.innerHTML = '';

        data.routes.forEach(route => {
            const routeDiv = document.createElement('div');
            routeDiv.className = 'route-box';

            let html = `<div class="route-title">${route.route_name}</div>`;

            if (route.buses.length === 0) {
                html += `<div class="no-data">現在運行中の便はありません。</div>`;
            } else {
                html += `
                    <table>
                        <thead>
                            <tr>
                                <th>便</th>
                                <th>内部番号 (bv_id)</th>
                                <th>社番</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                route.buses.forEach(bus => {
                    html += `
                        <tr>
                            <td>${bus.bien_index}便</td>
                            <td>${bus.bv_id ? bus.bv_id : '-'}</td>
                            <td><strong>${bus.shaban}</strong></td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
            }

            routeDiv.innerHTML = html;
            contentArea.appendChild(routeDiv);
        });
    }

    renderBusData();
</script>
